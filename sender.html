<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Donation Homepage</title>
</head>
<body>
    <h1>Welcome to Food Donation</h1>
    <p>Total Donated Food: <span id="totalFood">0</span> kgs</p>

    <script>
        function updateTotalFood() {
            // Retrieve total food donated from local storage
            const totalFood = parseInt(localStorage.getItem('totalFood')) || 0;

            // Update the total food display on the homepage
            document.getElementById('totalFood').innerText = totalFood + ' kgs';
        }

        // Update total food on page load
        updateTotalFood();

        // Listen for changes in local storage (e.g., when a new restaurant donates food)
        window.addEventListener('storage', updateTotalFood);
    </script>
</body>
</html>
