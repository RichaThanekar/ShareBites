<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Donation Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container" id="container">
        <h1>Restaurant Dashboard</h1>
        <div class="form-container">
            <label for="foodType">Food Type:</label>
            <input type="text" id="foodType">
            <label for="quantity">Quantity:</label>
            <input type="number" id="quantity">
            <label for="phoneNumber">Phone Number:</label>
            <input type="text" id="phoneNumber">
            <label for="pickUpTime">Pick-up Time:</label>
            <input type="time" id="pickUpTime" class="timer">
            <label for="location">Pick-up Location:</label>
            <input type="text" id="location">
            <label for="message">Want to write any message?</label>
            <input type="text" id="message" placeholder="Write your message here...">
        </div>
        <div class="button-container">
            <button onclick="addToInventory()">Add to Inventory</button>
        </div>
        <h2>Pending Transactions</h2>
        <table id="transactionTable">
            <thead>
                <tr>
                    <th>Food Type</th>
                    <th>Quantity (kgs)</th>
                    <th>Phone Number</th>
                    <th>Pick-up Time</th>
                    <th>Location</th>
                    <th>Message</th>
                </tr>
            </thead>
            <tbody>
                <!-- Transaction items will be displayed here dynamically -->
            </tbody>
        </table>
        <div id="totalDonated" class="total-donated"></div>
        <canvas id="chart" width="400" height="400"></canvas>
    </div>
    <script src="script1.js"></script>
    <script>
        function addToInventory() {
            // Get the input values
            const foodType = document.getElementById('foodType').value;
            const quantity = document.getElementById('quantity').value;
            const phoneNumber = document.getElementById('phoneNumber').value;
            const pickUpTime = document.getElementById('pickUpTime').value;
            const location = document.getElementById('location').value;
            const message = document.getElementById('message').value;

            // Append a new row to the table with the input values
            const table = document.getElementById('transactionTable').getElementsByTagName('tbody')[0];
            const newRow = table.insertRow();
            const cell1 = newRow.insertCell(0);
            const cell2 = newRow.insertCell(1);
            const cell3 = newRow.insertCell(2);
            const cell4 = newRow.insertCell(3);
            const cell5 = newRow.insertCell(4);
            const cell6 = newRow.insertCell(5);
            cell1.innerHTML = foodType;
            cell2.innerHTML = quantity;
            cell3.innerHTML = phoneNumber;
            cell4.innerHTML = pickUpTime;
            cell5.innerHTML = location;
            cell6.innerHTML = message;

            // Clear the input fields
            document.getElementById('foodType').value = '';
            document.getElementById('quantity').value = '';
            document.getElementById('phoneNumber').value = '';
            document.getElementById('pickUpTime').value = '';
            document.getElementById('location').value = '';
            document.getElementById('message').value = '';

            // Trigger a storage event to update other open tabs/pages
            window.dispatchEvent(new Event('storage'));
        }
    </script>
</body>
</html>
